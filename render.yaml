# Render Blueprint — deploys the DynForge backend (BE/) as a Docker web service.
# Render dashboard -> New -> Blueprint -> pick this repository. Then fill every "sync: false"
# value in the dashboard (Render asks for them during setup). See PLAYSTORE.md, step 2.
services:
  - type: web
    name: dynforge-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./BE
    dockerfilePath: ./BE/Dockerfile
    healthCheckPath: /api/universities
    envVars:
      # --- required ---
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: dynforge
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SEED_DEMO_ACCOUNTS
        value: "false"
      # --- first admin (delete ADMIN_PASSWORD after the first start) ---
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # --- payments / email / AI ---
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
