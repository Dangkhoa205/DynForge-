spring.application.name=DynForge
# Local dev: copy application-local.properties.example -> application-local.properties (gitignored)
spring.config.import=optional:classpath:application-local.properties

# Render/Railway inject PORT; locally it stays 8080
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# All secrets come from environment variables. NEVER put real keys in this file:
# it is committed to a public GitHub repository.
# ---------------------------------------------------------------------------

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/dynforge}
spring.data.mongodb.database=${MONGODB_DATABASE:dynforge}

# Must be Base64 of >= 32 random bytes. No default on purpose: the app refuses to start without it.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=2592000000

app.webhook.secret=${WEBHOOK_SECRET}
app.payment.base-url=${PAYMENT_BASE_URL:http://localhost:8080}
# Public URL of the web frontend (Vercel). PayOS sends the buyer back here after paying.
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Comma-separated list of origins allowed to call the API.
# https://localhost = the Capacitor Android app.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://localhost}

# Demo accounts share a password published in this repo -> must be false in production.
app.seed.demo-accounts=${SEED_DEMO_ACCOUNTS:true}
# Production: first admin account is created from these (then remove ADMIN_PASSWORD from the host).
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}

# Password-reset OTP validity (10 minutes)
app.otp.expiration-ms=600000

# OTP email (Brevo Transactional SMTP Relay). Empty -> OTP is only written to the server log.
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USER:}
spring.mail.password=${BREVO_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:dynforge.edu.hcmcity@gmail.com}
app.mail.sender-name=DynForge Support

# Google Sign-In (OAuth Web Client ID - public by design). Empty -> Google button shows "not configured".
google.client-id=${GOOGLE_CLIENT_ID:}

# Session recordings (dispute evidence, admin-only)
app.recordings.dir=${RECORDINGS_DIR:./recordings}
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Google Gemini AI. Empty -> built-in fallback engine answers instead.
gemini.base-url=https://generativelanguage.googleapis.com
gemini.api-key=${GEMINI_API_KEY:}

# PayOS payment gateway
payos.base-url=https://api-merchant.payos.vn
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
